<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="efl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05131e" />
      <stop offset="50%" stop-color="#040b14" />
      <stop offset="100%" stop-color="#091a2a" />
    </linearGradient>
    <linearGradient id="efl-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="efl-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="efl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#efl-bg)"/>
  
  <!-- Subtle Grid -->
  <pattern id="efl-grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="700" fill="url(#efl-grid)" />

  <!-- Ambient Glows -->
  <circle cx="150" cy="120" r="160" fill="#0284c7" opacity="0.18" filter="url(#efl-glow)"/>
  <circle cx="1050" cy="500" r="200" fill="#10b981" opacity="0.12" filter="url(#efl-glow)"/>

  <!-- Top App Navigation -->
  <rect x="50" y="40" width="1100" height="60" rx="16" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  
  <!-- Football League Logo -->
  <circle cx="85" cy="70" r="14" fill="url(#efl-accent)"/>
  <circle cx="85" cy="70" r="8" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <text x="115" y="76" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" letter-spacing="1">EFL SEASON 2</text>
  <rect x="270" y="58" width="155" height="24" rx="12" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
  <text x="347" y="74" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">LEAGUE MANAGER</text>

  <!-- Live WebSocket Pulsing Indicator -->
  <rect x="850" y="56" width="180" height="28" rx="14" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
  <circle cx="870" cy="70" r="5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="955" y="74" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">WEBSOCKET LIVE STREAM</text>

  <!-- Match Arena Hero Card -->
  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="1100" height="190" rx="20" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    
    <!-- Match Info Header -->
    <rect x="30" y="20" width="100" height="22" rx="6" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="0.8"/>
    <text x="80" y="35" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">LIVE • 78'</text>
    <text x="145" y="35" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">CHAMPIONSHIP SEMI-FINAL • STADIUM PITCH 1</text>

    <!-- Team A -->
    <text x="180" y="105" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="800" text-anchor="middle">TITANS FC</text>
    <text x="180" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Rank #1 • 8 Wins</text>

    <!-- Score Center -->
    <rect x="470" y="60" width="160" height="75" rx="14" fill="#030712" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <text x="550" y="112" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="4">3 - 2</text>

    <!-- Team B -->
    <text x="920" y="105" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="800" text-anchor="middle">STORM UNITED</text>
    <text x="920" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Rank #3 • 6 Wins</text>

    <!-- In-Game Match Event Stream -->
    <text x="550" y="160" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">⚡ 74' GOAL! D. Silva (Assist: K. Perera) — Broadcast via FastAPI WebSocket</text>
  </g>

  <!-- Bottom Left: Standings & Tournament Stats -->
  <g transform="translate(50, 330)">
    <rect x="0" y="0" width="600" height="300" rx="18" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="25" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Tournament Standings &amp; Points Table</text>
    <text x="25" y="55" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">PostgreSQL Relational Analytics &amp; Goal Differentials</text>

    <!-- Table Header -->
    <rect x="25" y="70" width="550" height="30" rx="6" fill="rgba(255, 255, 255, 0.03)"/>
    <text x="40" y="89" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">POS</text>
    <text x="100" y="89" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">CLUB</text>
    <text x="280" y="89" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">PLAYED</text>
    <text x="380" y="89" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">GD</text>
    <text x="500" y="89" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">PTS</text>

    <!-- Row 1 -->
    <rect x="25" y="105" width="550" height="38" rx="6" fill="rgba(255, 255, 255, 0.02)"/>
    <text x="40" y="129" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1</text>
    <text x="100" y="129" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Titans FC</text>
    <text x="295" y="129" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">10</text>
    <text x="385" y="129" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">+14</text>
    <text x="505" y="129" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="800">25</text>

    <!-- Row 2 -->
    <rect x="25" y="148" width="550" height="38" rx="6" fill="rgba(255, 255, 255, 0.01)"/>
    <text x="40" y="172" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2</text>
    <text x="100" y="172" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Apex Warriors</text>
    <text x="295" y="172" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">10</text>
    <text x="385" y="172" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">+9</text>
    <text x="505" y="172" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="800">22</text>

    <!-- Row 3 -->
    <rect x="25" y="191" width="550" height="38" rx="6" fill="rgba(255, 255, 255, 0.02)"/>
    <text x="40" y="215" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="700">3</text>
    <text x="100" y="215" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Storm United</text>
    <text x="295" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">10</text>
    <text x="385" y="215" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">+6</text>
    <text x="505" y="215" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="800">19</text>

    <!-- Row 4 -->
    <rect x="25" y="234" width="550" height="38" rx="6" fill="rgba(255, 255, 255, 0.01)"/>
    <text x="40" y="258" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="700">4</text>
    <text x="100" y="258" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Lions SC</text>
    <text x="295" y="258" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">10</text>
    <text x="385" y="258" fill="#f87171" font-family="system-ui, sans-serif" font-size="12">-2</text>
    <text x="505" y="258" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="800">14</text>
  </g>

  <!-- Bottom Right: Next.js Admin & Live Console -->
  <g transform="translate(675, 330)">
    <rect x="0" y="0" width="475" height="300" rx="18" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="25" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Next.js Administration Console</text>
    <text x="25" y="55" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">FastAPI Backend • Real-time Lineups &amp; In-game Dispatch</text>

    <!-- Stat Tiles -->
    <rect x="25" y="75" width="200" height="90" rx="12" fill="#090f1d" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
    <text x="45" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">REGISTERED PLAYERS</text>
    <text x="45" y="145" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="28" font-weight="800">184</text>

    <rect x="245" y="75" width="200" height="90" rx="12" fill="#090f1d" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1"/>
    <text x="265" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">FIXTURES MANAGED</text>
    <text x="265" y="145" fill="#34d399" font-family="system-ui, sans-serif" font-size="28" font-weight="800">42</text>

    <!-- Admin Fast Controls -->
    <rect x="25" y="180" width="420" height="95" rx="12" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    <text x="40" y="205" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Direct Referee Dispatch Actions</text>
    <rect x="40" y="222" width="105" height="34" rx="8" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="92" y="243" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">+ Add Goal</text>

    <rect x="155" y="222" width="105" height="34" rx="8" fill="rgba(234, 179, 8, 0.2)" stroke="#facc15" stroke-width="0.8"/>
    <text x="207" y="243" fill="#fef08a" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Yellow / Red Card</text>

    <rect x="270" y="222" width="105" height="34" rx="8" fill="rgba(16, 185, 129, 0.2)" stroke="#34d399" stroke-width="0.8"/>
    <text x="322" y="243" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">End Match</text>
  </g>

  <!-- Footer Info -->
  <g transform="translate(50, 655)">
    <text x="0" y="16" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">TECH STACK:</text>
    <text x="95" y="16" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="500">FastAPI (Python) • Next.js Live Score Portal • Next.js Admin Console • WebSockets • PostgreSQL • REST APIs</text>
  </g>
</svg>
